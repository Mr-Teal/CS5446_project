; Integration smoke only: two colour-swapped, four-ply attempts on a public pawn fixture.
; Edit stockfish_path for your host. The runner records its actual executable SHA256.
; Requires an existing torch-enabled project environment; no training is performed.

[player_a]
name = Network1 fixed search
factory = pairb.search_factory:Factory
leaf_evaluator = network1
leaf_depth = 1
checkpoint_path = pair_b/checkpoints/net1-v2/best.pt
checkpoint_sha256 = ab470346acb5eb37947e3ab0eb43c005894ae72569ca016d7635fc2be6f9171f
device = cpu
stockfish_path = stockfish
stockfish_hash_mb = 16
stockfish_new_game_each_call = false
stockfish_call_timeout_s = 2
search_mode = fixed
search_depth = 2
solver_rounds = 16
max_nodes = 4096
stop_on_time = true
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
public_initial_fen = 7k/8/8/8/8/8/P6p/K7 w - - 0 1
tracker_policy = exact
max_candidates = 2000
sample_size = 4
tracker_backend = auto

[player_b]
name = Stockfish D1 fixed search
factory = pairb.search_factory:Factory
leaf_evaluator = stockfish
leaf_depth = 1
stockfish_path = stockfish
stockfish_hash_mb = 16
stockfish_new_game_each_call = false
stockfish_call_timeout_s = 2
search_mode = fixed
search_depth = 2
solver_rounds = 16
max_nodes = 4096
stop_on_time = true
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
public_initial_fen = 7k/8/8/8/8/8/P6p/K7 w - - 0 1
tracker_policy = exact
max_candidates = 2000
sample_size = 4
tracker_backend = auto

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 5000
max_plies = 4
initial_fen = 7k/8/8/8/8/8/P6p/K7 w - - 0 1
seed = 17
seed_mode = per_game

[output]
directory = pair_c/runs/network1-search-smoke
hash_rules = pair_c/hash_rules.json
