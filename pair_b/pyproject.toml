[project]
name = "pairb"
version = "0.1.0"
description = "CS5446/CS4246 Fog-of-War Chess, Pair B: labels, learned evaluator, training"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "fow-shared",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "torch>=2.14.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# python-chess 1.11.2 itself raises these on Python 3.14; not our code
filterwarnings = ["ignore::DeprecationWarning:chess.engine"]

[tool.uv.sources]
fow-shared = { path = "..", editable = true }
