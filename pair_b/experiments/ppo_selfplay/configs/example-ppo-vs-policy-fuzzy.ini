; Example: the PPO network (player_a) against the policy network (player_b), 2 games.
; Run from the repository root with PYTHONPATH set as in pair_b/docs/handover_ppo_agent_2026-11-15.md, section 5:
;     python -m pair_c.run_evaluation pair_b/experiments/ppo_selfplay/configs/example-ppo-vs-policy-fuzzy.ini
; On this protocol and these seeds the recorded games are in results/ppo-vs-policy-fuzzy.tar.gz
; (games 1 and 2: the PPO network won both).

[player_a]
name = PPO self-play network (final network of the 12.2-hour run; no belief, no search; move choice: sample)
factory = ppo_player:PpoFactory
; Relative to the package folder (the player resolves it); an absolute path also works.
checkpoint_path = checkpoints/ppo-selfplay-12h/final.pt
; sample = draw the move from the policy, as in training and in every recorded match.
; best = the most likely move (not measured in these matches).
move_choice = sample
device = cpu
leaf_depth = 0
; The PPO network uses no belief. This tracker is a placeholder and cannot fail.
tracker_factory = ppo_player:NoBeliefFactory

[player_b]
; The handover's proposed player section, unchanged except for device (cuda on your machine).
name = Policy network, no search (fuzzy board, 56,437 positions, seed 2)
factory = pairb.policy_agent:PolicyFactory
checkpoint_path = pair_b/checkpoints/policy-conv-fuzzy-r2-s2/best.pt
device = cpu
leaf_depth = 0
tracker_factory = guard_tracker:Factory
max_states = 96000
sample_size = 16
max_candidates = none
tracker_policy = exact
tracker_backend = auto

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 5000
max_plies = 200
initial_fen =
seed = 1001
seed_mode = per_game

[output]
directory = pair_c/runs/ppo-example-vs-policy-fuzzy
hash_rules = pair_c/hash_rules.json
