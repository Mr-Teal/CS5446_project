; Example: the PPO network (player_a) against the Material OnePlyBot (player_b), 2 games, about 20 s.
; Run from the repository root with PYTHONPATH set as in pair_b/docs/handover_ppo_agent_2026-11-15.md, section 5:
;     python -m pair_c.run_evaluation pair_b/experiments/ppo_selfplay/configs/example-ppo-vs-oneply-material.ini
; The recorded games on these seeds are in results/ppo-vs-oneply-material.tar.gz (games 1 and 2).

[player_a]
name = PPO self-play network (final network of the 12.2-hour run; no belief, no search; move choice: sample)
factory = ppo_player:PpoFactory
checkpoint_path = checkpoints/ppo-selfplay-12h/final.pt
move_choice = sample
device = cpu
leaf_depth = 0
tracker_factory = ppo_player:NoBeliefFactory

[player_b]
; Player B of Pair A's strength arms, unchanged.
name = Material OnePlyBot (particle tracker)
factory = pair_c.agent_factories:Factory
scorer_id = material
leaf_depth = 0
device = cpu
tracker_factory = pair_c.tracker_factories:Factory
tracker_particles = 256
tracker_hypotheses = 8
tracker_rebuild_tries = 2000

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 5000
max_plies = 200
initial_fen =
seed = 1001
seed_mode = per_game

[output]
directory = pair_c/runs/ppo-example-vs-oneply-material
hash_rules = pair_c/hash_rules.json
