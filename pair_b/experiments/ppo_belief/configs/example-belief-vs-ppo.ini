; Example: the belief-input PPO network (player_a) against the first PPO agent (player_b), 2 games.
; Run from the repository root with PYTHONPATH set as in pair_b/docs/handover_ppo_belief_agent_2026-11-15.md, section 5:
;     python -m pair_c.run_evaluation pair_b/experiments/ppo_belief/configs/example-belief-vs-ppo.ini
; On this protocol and these seeds the recorded games are in results/belief-vs-ppo.tar.gz (games 1 and 2).
; The belief-input player draws its moves and its belief sample at random from the game's seed, so a
; replay gives the same two games.

[player_a]
name = PPO self-play network with belief input (final network of the 5-hour run; own belief sampler, no search; move choice: sample)
factory = ppo_belief_player:PpoBeliefFactory
; Relative to the package folder (the player resolves it); an absolute path also works.
checkpoint_path = checkpoints/ppo-belief-5h/final.pt
; sample = draw the move from the policy, as in training and in every recorded match.
; best = the most likely move (not measured in these matches).
move_choice = sample
device = cpu
leaf_depth = 0
; The player keeps its own belief sampler. This tracker is a placeholder and cannot fail.
tracker_factory = ppo_belief_player:NoBeliefFactory

[player_b]
; The first PPO agent (pair_b/experiments/ppo_selfplay). Its checkpoint path is relative to ITS package folder.
name = PPO self-play network (final network of the 12.2-hour run; no belief, no search; move choice: sample)
factory = ppo_player:PpoFactory
checkpoint_path = checkpoints/ppo-selfplay-12h/final.pt
move_choice = sample
device = cpu
leaf_depth = 0
tracker_factory = ppo_player:NoBeliefFactory

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 5000
max_plies = 200
initial_fen =
seed = 1001
seed_mode = per_game

[output]
directory = pair_c/runs/ppo-belief-example-vs-ppo
hash_rules = pair_c/hash_rules.json
