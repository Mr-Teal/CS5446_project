; The belief-input PPO network as "our side" of the misty harness (`mistymatch.launch --ours-config`; the harness is not in this repository).
; The harness reads only the [player] section.
;
; checkpoint_path must be ABSOLUTE here: the harness turns a relative path into a path inside the
; team repository before the player sees it. Replace the placeholder with the path of
; checkpoints/ppo-belief-5h/final.pt on your machine.

[player]
name = PPO self-play network with belief input (final network of the 5-hour run; own belief sampler, no search; move choice: sample)
factory = ppo_belief_player:PpoBeliefFactory
checkpoint_path = /ABSOLUTE/PATH/TO/CS5446_project/pair_b/experiments/ppo_belief/checkpoints/ppo-belief-5h/final.pt
move_choice = sample
leaf_depth = 0
tracker_factory = ppo_belief_player:NoBeliefFactory
