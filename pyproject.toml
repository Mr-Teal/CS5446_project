[project]
name = "fow-shared"
version = "0.1.0"
description = "Shared contracts for fog-of-war chess agents and training"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21", "python-chess>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
# Ship only the shared package; pair_a_prep and tests are not installed.
packages = ["fow_shared"]
