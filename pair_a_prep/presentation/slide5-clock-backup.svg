<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#0b1426"/><g font-family="Segoe UI,Arial,sans-serif"><text x="65" y="65" font-size="19" fill="#70dac5" font-weight="600">FOG OF WAR CHESS / PAIR A</text><text x="65" y="125" font-size="43" fill="#eaf0ff" font-weight="700">Clock budgets and purification: measured limits</text><text x="65" y="171" font-size="23" fill="#b1bfd5" font-weight="400">Backup for slide 5 | Two seeds, two repeats | Caller surrounds the entire act() call</text><text x="80" y="235" font-size="25" fill="#70dac5" font-weight="400">Median caller time (ms); counts shown as purify-off / purify-on</text><text x="80" y="290" font-size="22" fill="#eaf0ff" font-weight="600">Fixture</text><text x="355" y="290" font-size="22" fill="#eaf0ff" font-weight="600">Budget</text><text x="520" y="290" font-size="22" fill="#eaf0ff" font-weight="600">Purify-off</text><text x="755" y="290" font-size="22" fill="#eaf0ff" font-weight="600">Purify-on</text><text x="1040" y="290" font-size="22" fill="#eaf0ff" font-weight="600">Overruns</text><text x="1290" y="290" font-size="22" fill="#eaf0ff" font-weight="600">Fallbacks</text><text x="80" y="340" font-size="22" fill="#eaf0ff" font-weight="400">Cold standard</text><text x="355" y="340" font-size="22" fill="#eaf0ff" font-weight="400">20 ms</text><text x="520" y="340" font-size="22" fill="#eaf0ff" font-weight="400">12.4</text><text x="755" y="340" font-size="22" fill="#eaf0ff" font-weight="400">12.3</text><text x="1040" y="340" font-size="22" fill="#eaf0ff" font-weight="400">0 / 0</text><text x="1290" y="340" font-size="22" fill="#eaf0ff" font-weight="400">4 / 4</text><line x1="80" y1="356" x2="1510" y2="356" stroke="#293b55" stroke-width="3"/><text x="80" y="388" font-size="22" fill="#eaf0ff" font-weight="400">Cold standard</text><text x="355" y="388" font-size="22" fill="#eaf0ff" font-weight="400">100 ms</text><text x="520" y="388" font-size="22" f