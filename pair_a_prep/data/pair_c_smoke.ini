; Requires the Pair C runner from PR26 and the integrated Pair A source.
; Bounded interface smoke only: no engine, checkpoint, GPU, or strength claim.
[player_a]
name = Pair A uniform-growth Material
factory = pair_a_prep.evaluation_factories:SearchFactory
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
search_mode = anytime
leaf_depth = 0
public_initial_fen = 7k/8/8/8/8/8/8/K7 w - - 0 1
solver_rounds = 8
initial_depth = 1
max_depth = 2
rounds_per_stage = 2
final_rounds = 2
max_nodes = 512
max_evaluator_calls = 16
sample_size = 4
max_candidates = 2000
stop_on_time = false

[player_b]
name = Pair A fixed-depth Material
factory = pair_a_prep.evaluation_factories:SearchFactory
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
search_mode = fixed
leaf_depth = 0
public_initial_fen = 7k/8/8/8/8/8/8/K7 w - - 0 1
solver_rounds = 8
search_depth = 1
max_nodes = 512
sample_size = 4
max_candidates = 2000
stop_on_time = false

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 1000
max_plies = 6
initial_fen = 7k/8/8/8/8/8/8/K7 w - - 0 1
seed = 17
seed_mode = per_game

[output]
; Pick a fresh path on each run. Capped records are not observed terminal draws.
directory = pair_a_prep/local_runs/pair-c-smoke
