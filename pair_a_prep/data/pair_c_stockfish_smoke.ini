; Engine-backed delivery candidate, not a formal win-rate batch.
; Configure stockfish_path or use the stockfish_handoff --stockfish-path override.
; Both players use one-thread Stockfish 19 D1 with fresh per-call engine state.
[player_a]
name = Obscuro-inspired sampled subgame / SF19 D1
factory = pair_a_prep.evaluation_factories:SearchFactory
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
leaf_evaluator = stockfish
leaf_depth = 1
stockfish_path = stockfish
stockfish_expected_name = Stockfish 19
stockfish_hash_mb = 16
stockfish_new_game_each_call = true
stockfish_call_timeout_s = 2
search_mode = subgame
growth = one_sided
initial_depth = 1
max_depth = 2
solver_rounds = 8
rounds_per_stage = 2
final_rounds = 2
max_nodes = 1024
max_evaluator_calls = 48
purify = true
submission_reserve_fraction = 0.1
sample_size = 3
max_candidates = 2000
stop_on_time = false
public_initial_fen = 4k3/8/8/3p4/4P3/8/8/4K3 w - - 0 1

[player_b]
name = Fixed depth 1 reference / SF19 D1
factory = pair_a_prep.evaluation_factories:SearchFactory
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
leaf_evaluator = stockfish
leaf_depth = 1
stockfish_path = stockfish
stockfish_expected_name = Stockfish 19
stockfish_hash_mb = 16
stockfish_new_game_each_call = true
stockfish_call_timeout_s = 2
search_mode = fixed
search_depth = 1
solver_rounds = 8
max_nodes = 1024
sample_size = 3
max_candidates = 2000
stop_on_time = false
public_initial_fen = 4k3/8/8/3p4/4P3/8/8/4K3 w - - 0 1

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 10000
max_plies = 4
initial_fen = 4k3/8/8/3p4/4P3/8/8/4K3 w - - 0 1
seed = 17
seed_mode = per_game

[output]
directory = pair_a_prep/local_runs/stockfish-pair-c-smoke
