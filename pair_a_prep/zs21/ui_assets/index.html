<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fog of War · ZS21</title><link rel="stylesheet" href="/style.css"><style>
#boards{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.board-panel{max-width:max(260px,min(620px,calc(100vh - 330px)));width:100%;margin:auto}.spectator .board-panel{max-width:620px}.piece{font-size:clamp(24px,4.5vh,48px)}.spectator .piece{font-size:clamp(24px,3.5vw,43px)}#status{margin:16px 0}.board-panel h2{margin-bottom:12px}.board-panel p{font-size:13px}.history{max-height:160px;overflow:auto;font-size:13px}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:20px}#promotion button{font-size:30px;margin:8px}
</style></head><body><main><header><div class="eyebrow">PAIR A · ZS21 REPRODUCTION</div><h1>Fog of War Chess</h1><p id="intro">Loading your view…</p></header><div id="error" role="alert" hidden></div><div id="status" aria-live="polite"></div><div class="toolbar"><button id="reset" hidden>New standard game</button></div><div id="boards"></div><p class="muted">Click a piece, then a highlighted destination. Capturing the king wins; check does not restrict your moves.</p><dialog id="promotion"><h2>Choose a promotion</h2><div id="choices"></div><button id="cancel">Cancel</button></dialog></main><script src="/app.js"></script></body></html>
