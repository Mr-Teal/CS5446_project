; probe p7-s128-narrow: sample 128 with p4's node allowance, to attribute p6's OOM
;
; One game, capped at 40 plies, exact belief, Material both sides. This is a
; cost measurement, not a strength measurement; the arms come after.

[player_a]
name = probe p7-s128-narrow
factory = pair_a_prep.evaluation_factories:SearchFactory
search_mode = subgame
leaf_evaluator = material
leaf_depth = 0
tracker_factory = pruned_tracker:Factory
max_histories = 10000
sample_size = 128
max_candidates = none
tracker_policy = exact
tracker_backend = auto
solver_rounds = 1024
max_nodes = 16384
max_evaluator_calls = 4096
stop_on_time = true

[player_b]
name = Material OnePlyBot (particle tracker)
factory = pair_c.agent_factories:Factory
scorer_id = material
leaf_depth = 0
device = cpu
tracker_factory = pair_c.tracker_factories:Factory
tracker_particles = 256
tracker_hypotheses = 8
tracker_rebuild_tries = 2000

[match]
games = 1
alternating_colors = true
rules = teal
time_budget_ms = 5000
max_plies = 40
initial_fen =
seed = 1001
seed_mode = per_game

[output]
directory = pair_c/runs/probe-p9-s128-pruned
hash_rules = pair_c/hash_rules.json
