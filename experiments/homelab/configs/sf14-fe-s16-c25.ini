; Strength arm sf14-fe-s16, chunk 25 of 50
;
; ARM 5. Baseline hypotheses, search spends its 5 s budget instead of
; stopping after eight rounds. Probe p4 measured 386 rounds per move here
; against the baseline's 8, with no fallbacks.
;
; Material evaluator on BOTH sides, standard start, alternating colours, 5 s per
; move, 200-ply cap. Same seeds and colours as the exact-s16 baseline, so the
; paired unit is one seed.

[player_a]
name = Pair A subgame PCFR+ (exact belief, sample 16, full effort, Stockfish 14.1 d1)
factory = pair_a_prep.evaluation_factories:SearchFactory
search_mode = subgame
leaf_evaluator = stockfish
leaf_depth = 1
tracker_factory = pair_a_prep.evaluation_factories:HistoryTrackerFactory
sample_size = 16
max_candidates = none
tracker_policy = exact
tracker_backend = auto
solver_rounds = 1024
max_nodes = 16384
max_evaluator_calls = 4096
stop_on_time = true

stockfish_path = /usr/games/stockfish
stockfish_sha256 = 79aa1e0c17294d94d07df98ebd0c0af04036a905837cfd2f98689d37e0c75013
stockfish_expected_name = Stockfish 14.1
stockfish_hash_mb = 16
[player_b]
name = Material OnePlyBot (particle tracker)
factory = pair_c.agent_factories:Factory
scorer_id = material
leaf_depth = 0
device = cpu
tracker_factory = pair_c.tracker_factories:Factory
tracker_particles = 256
tracker_hypotheses = 8
tracker_rebuild_tries = 2000

[match]
games = 2
alternating_colors = true
rules = teal
time_budget_ms = 5000
max_plies = 200
initial_fen =
seed = 1049
seed_mode = per_game

[output]
directory = pair_c/runs/strength-sf14-fe-s16-c25
hash_rules = pair_c/hash_rules.json
