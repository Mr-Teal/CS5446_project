; Main evaluation settings. Paths below are relative to the project root unless absolute.
; Edit this file before running. Each player section is loaded independently.
; The default match is an ablation: two OnePlyBot instances with different scorers.

[player_a]
; The runner calls this factory class once for each player and independently loads its model.
; name: display name recorded in results.
name = Network1 OnePlyBot
; factory: python.module:FactoryClass. The runner calls FactoryClass(settings),
; passing all entries from this player section as a mapping of strings.
; The factory's load_model() returns the Agent used by play_game().
factory = pair_c.agent_factories:Factory
; Built-in one-ply scorer IDs: material, stockfish-d1, stockfish-d11, network1, belief.
scorer_id = network1
; Concrete .pt file passed directly to the network loader.
checkpoint_path = pair_b/checkpoints/net1-v2/best.pt
; Network inference device, for example cuda:0 or cpu. Stockfish runs on the CPU.
device = cuda:0
; Stockfish executable path, or a command available on PATH.
stockfish_path = pair_c/tools/stockfish/stockfish-windows-x86-64-universal.exe
; Search leaf depth for this player. The shared MatchConfig accepts one depth per game,
; so when the players differ the runner passes the larger configured value.
leaf_depth = 1
; Belief-tracker settings for THIS player, reused from Pair B's ParticleTracker
; (pair_b/src/pairb/tracker.py). Particles and hypotheses must be positive;
; rebuild tries cannot be negative.
tracker_particles = 256
tracker_hypotheses = 8
tracker_rebuild_tries = 2000

[player_b]
; Ablation example: same factory class, independently loaded with a different scorer.
; Field meanings are the same as in player_a; each side may use different values.
; OnePlyBot calls belief once per hypothesized board, not with the full belief context.
name = Belief OnePlyBot
factory = pair_c.agent_factories:Factory
scorer_id = belief
; Concrete .pt file passed directly to the network loader.
checkpoint_path = pair_b/checkpoints/belief-v1-d1/best.pt
device = cuda:0
stockfish_path = pair_c/tools/stockfish/stockfish-windows-x86-64-universal.exe
; Search depth is configured independently for this player.
leaf_depth = 1
; Same tracker settings as player_a, but configured independently per player.
tracker_particles = 256
tracker_hypotheses = 8
tracker_rebuild_tries = 2000

[match]
; Any positive game count. An odd count gives Player A one extra White game when alternating.
games = 10
; A plays White in games 1, 3, 5, ... and Black in games 2, 4, 6, ... .
; An even game count gives both players each color equally often.
alternating_colors = true
; Explicit rules implementation: standin or teal. teal requires its adapter to be available.
rules = standin
; Per-move budget passed through AgentInput. The runner measures act() time and flags overruns.
; Current OnePlyBot ignores the budget; the runner does not forcibly interrupt agents.
; Future agents can use this input to enforce their own search deadline.
time_budget_ms = 5000
; Maximum total half-moves per game. Reaching this limit is recorded as a draw.
max_plies = 200
; Optional six-field FEN. Leave empty for the standard initial position.
initial_fen =

; Non-negative base random seed.
seed = 17
; fixed reuses seed for all games; per_game uses seed + zero-based game index.
seed_mode = per_game

[output]
; Results directory. It must not already exist, to avoid overwriting a previous run.
directory = pair_c/runs/network1-vs-belief
