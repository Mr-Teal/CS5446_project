[execution]
status = "implemented_local_validation"
engine_pool_count = 1
engine_workers_source = "value.execution"
pool_sharing = "acting_agent_uses_pool_other_agent_does_not_search"
lp_threads = 1
parallel_games = 1
evaluation_cache_scope = "per_agent_per_game"
include_search_mode_and_limits_in_cache_key = true

[evaluation]
status = "historical_batch_stopped_at_34_no_new_release_tournament"
participants = ["paper_agent", "baseline"]
value_variant = "main"
initial_position = "standard_initial_position"
games = 100
paper_agent_white_games = 50
paper_agent_black_games = 50
color_schedule = "alternate_paper_agent_color"
seed_policy = "record_independent_streams_per_game_and_agent"
