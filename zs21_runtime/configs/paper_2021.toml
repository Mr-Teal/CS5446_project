result_perspective = "paper_agent"
primary_metrics = ["wins", "draws", "losses"]
report_by_color = true
outcomes_source = "referee_not_search_utility"
incomplete_runs = "record_separately_do_not_convert_to_wdl_or_silently_drop"

[evaluation.acceptance]
implementation = "paper_description_with_confirmed_decisions"
correctness = "required_checks_pass_no_unresolved_known_bugs"
completed_games = 100
