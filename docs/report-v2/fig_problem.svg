<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" role="img" aria-label="Three problem types: an MDP, where the agent sees the full state and any opponent is fixed inside the environment; a POMDP, where the agent sees only an observation and keeps a belief, the opponent still fixed; and a two-player zero-sum game with hidden information, where each player has its own observation and the opponent chooses its play to beat us.">
  <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
  <g font-family="Times New Roman, Times, serif" fill="#1a1a1a" font-size="11">
    <!-- panel frames -->
    <rect x="3" y="3" width="216" height="194" fill="none" stroke="#bbbbbb"/>
    <rect x="232" y="3" width="216" height="194" fill="none" stroke="#bbbbbb"/>
    <rect x="461" y="3" width="216" height="194" fill="none" stroke="#b03a2e" stroke-width="1.4"/>
    <!-- (a) MDP -->
    <text x="11" y="19" font-size="12">(a) MDP</text>
    <rect x="66" y="30" width="90" height="28" fill="none" stroke="#1a1a1a"/>
    <text x="111" y="48" text-anchor="middle">Agent</text>
    <rect x="41" y="112" width="140" height="38" fill="none" stroke="#1a1a1a"/>
    <text x="111" y="128" text-anchor="middle">Environment</text>
    <text x="111" y="142" text-anchor="middle" font-size="9.5" font-style="italic">any opponent fixed inside</text>
    <line x1="88" y1="112" x2="88" y2="60" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <line x1="134" y1="58" x2="134" y2="110" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <text x="83" y="82" text-anchor="end" font-size="10">full state s,</text>
    <text x="83" y="94" text-anchor="end" font-size="10">reward r</text>
    <text x="139" y="88" font-size="10">action a</text>
    <text x="111" y="170" text-anchor="middle" font-size="10">Solve: policy π(s) that</text>
    <text x="111" y="183" text-anchor="middle" font-size="10">maximises expected return</text>
    <!-- (b) POMDP -->
    <text x="240" y="19" font-size="12">(b) POMDP</text>
    <rect x="285" y="30" width="110" height="28" fill="none" stroke="#1a1a1a"/>
    <text x="340" y="48" text-anchor="middle">Agent, belief b(s)</text>
    <rect x="270" y="112" width="140" height="38" fill="none" stroke="#1a1a1a"/>
    <text x="340" y="128" text-anchor="middle">Environment, hidden s</text>
    <text x="340" y="142" text-anchor="middle" font-size="9.5" font-style="italic">any opponent fixed inside</text>
    <line x1="317" y1="112" x2="317" y2="60" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <line x1="363" y1="58" x2="363" y2="110" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <text x="312" y="82" text-anchor="end" font-size="10">observation o,</text>
    <text x="312" y="94" text-anchor="end" font-size="10">reward r</text>
    <text x="368" y="88" font-size="10">action a</text>
    <text x="340" y="170" text-anchor="middle" font-size="10">Solve: policy π(b) that maximises</text>
    <text x="340" y="183" text-anchor="middle" font-size="10">expected return against that opponent</text>
    <!-- (c) zero-sum game with hidden information -->
    <text x="469" y="19" font-size="12">(c) Zero-sum game (our problem)</text>
    <rect x="468" y="30" width="62" height="28" fill="none" stroke="#1a1a1a"/>
    <text x="499" y="48" text-anchor="middle">White</text>
    <rect x="608" y="30" width="62" height="28" fill="none" stroke="#1a1a1a"/>
    <text x="639" y="48" text-anchor="middle">Black</text>
    <text x="569" y="42" text-anchor="middle" font-size="10">u<tspan baseline-shift="sub" font-size="7.5">W</tspan> = −u<tspan baseline-shift="sub" font-size="7.5">B</tspan></text>
    <rect x="504" y="112" width="130" height="38" fill="none" stroke="#1a1a1a"/>
    <text x="569" y="128" text-anchor="middle">Referee</text>
    <text x="569" y="142" text-anchor="middle" font-size="9.5" font-style="italic">knows the true board</text>
    <line x1="520" y1="112" x2="488" y2="60" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <line x1="512" y1="58" x2="543" y2="110" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <line x1="618" y1="112" x2="650" y2="60" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <line x1="626" y1="58" x2="595" y2="110" stroke="#1a1a1a" marker-end="url(#a1)"/>
    <text x="490" y="94" text-anchor="end" font-size="10">o<tspan baseline-shift="sub" font-size="7.5">W</tspan></text>
    <text x="533" y="80" font-size="10">move</text>
    <text x="648" y="94" font-size="10">o<tspan baseline-shift="sub" font-size="7.5">B</tspan></text>
    <text x="606" y="80" text-anchor="end" font-size="10">move</text>
    <text x="569" y="170" text-anchor="middle" font-size="10">Solve: strategies with the best</text>
    <text x="569" y="183" text-anchor="middle" font-size="10">worst-case result (equilibrium)</text>
  </g>
</svg>
