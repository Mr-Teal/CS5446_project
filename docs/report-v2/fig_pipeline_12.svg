<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 451 138" role="img" aria-label="How the training data is made: games, positions, re-solve, training, play."><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker><marker id="ara" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b03a2e"/></marker></defs><g font-family="Times New Roman, Times, serif" fill="#1a1a1a"><text x="0.0" y="13.0" font-size="12" text-anchor="start" font-style="italic">Offline: collect, label, train</text><rect x="1.0" y="20.0" width="139.0" height="40.0" fill="none" stroke="#1a1a1a" stroke-width="0.8"/><text x="70.0" y="36.0" font-size="12" text-anchor="middle" font-weight="bold">1 Games</text><text x="70.0" y="52.0" font-size="12" text-anchor="middle">961, both colours</text><rect x="156.0" y="20.0" width="139.0" height="40.0" fill="none" stroke="#1a1a1a" stroke-width="0.8"/><text x="225.0" y="36.0" font-size="12" text-anchor="middle" font-weight="bold">2 Positions</text><text x="225.0" y="52.0" font-size="12" text-anchor="middle">58,693, mover's view</text><rect x="311.0" y="20.0" width="139.0" height="40.0" fill="#e3e8ee" stroke="#1a1a1a" stroke-width="0.8"/><text x="380.0" y="36.0" font-size="12" text-anchor="middle" font-weight="bold">3 Re-solve</text><text x="380.0" y="52.0" font-size="12" text-anchor="middle">30 s, Stockfish d8</text><rect x="1.0" y="96.0" width="139.0" height="40.0" fill="none" stroke="#1a1a1a" stroke-width="0.8"/><text x="70.0" y="112.0" font-size="12" text-anchor="middle" font-weight="bold">4 Train</text><text x="70.0" y="128.0" font-size="12" text-anchor="middle">cross-entropy</text><rect x="311.0" y="96.0" width="139.0" height="40.0" fill="none" stroke="#1a1a1a" stroke-width="0.8"/><text x="380.0" y="112.0" font-size="12" text-anchor="middle" font-weight="bold"