<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 298" role="img" aria-label="Policy network architecture: the 32-plane probability board goes through a convolutional stem and six residual blocks of 64 channels, then a move head of a 3x3 and a 1x1 convolution gives 64 move-type scores on each square; a fixed table places them in the 4,096 from-to slots, the legal mask and a softmax give the move probabilities. 503,552 parameters.">
  <defs><marker id="a9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker></defs>
  <g font-family="Times New Roman, Times, serif" fill="#1a1a1a" font-size="10">
    <!-- row 1: input, stem, trunk, feature map -->
    <text x="4" y="12" font-size="11" font-style="italic">Encoder</text>
    <g stroke="#1a1a1a" stroke-width="0.8">
      <rect x="14" y="30" width="54" height="54" fill="#e3e8ee"/>
      <rect x="10" y="34" width="54" height="54" fill="#e3e8ee"/>
      <rect x="6" y="38" width="54" height="54" fill="#e3e8ee"/>
    </g>
    <text x="36" y="104" text-anchor="middle">probability board</text>
    <text x="36" y="116" text-anchor="middle" font-style="italic">32 × 8 × 8</text>
    <line x1="72" y1="60" x2="104" y2="60" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <rect x="106" y="30" width="118" height="62" fill="none" stroke="#1a1a1a"/>
    <text x="165" y="46" text-anchor="middle" font-size="11" font-weight="bold">Stem</text>
    <text x="165" y="60" text-anchor="middle">conv 3×3, 32 → 64</text>
    <text x="165" y="72" text-anchor="middle">BatchNorm, ReLU</text>
    <text x="165" y="86" text-anchor="middle" font-style="italic">18,560 parameters</text>
    <line x1="224" y1="60" x2="252" y2="60" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <g fill="#ffffff" stroke="#1a1a1a">
      <rect x="264" y="24" width="150" height="62"/>
      <rect x="260" y="28" width="150" height="62"/>
      <rect x="256" y="32" width="150" height="62"/>
    </g>
    <text x="331" y="48" text-anchor="middle" font-size="11" font-weight="bold">Residual block × 6</text>
    <text x="331" y="62" text-anchor="middle">64 channels, 8 × 8 kept</text>
    <text x="331" y="74" text-anchor="middle">(detail below)</text>
    <text x="331" y="88" text-anchor="middle" font-style="italic">443,904 parameters</text>
    <line x1="414" y1="60" x2="446" y2="60" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <g stroke="#1a1a1a" stroke-width="0.8">
      <rect x="458" y="30" width="54" height="54" fill="#ffffff"/>
      <rect x="454" y="34" width="54" height="54" fill="#ffffff"/>
      <rect x="450" y="38" width="54" height="54" fill="#ffffff"/>
    </g>
    <text x="480" y="104" text-anchor="middle">feature map</text>
    <text x="480" y="116" text-anchor="middle" font-style="italic">64 × 8 × 8</text>
    <!-- elbow from row 1 to row 2 -->
    <path d="M512,60 L640,60 L640,132 L20,132 L20,158" fill="none" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <text x="530" y="54" font-size="9.5" font-style="italic">one pass per move</text>
    <!-- row 2: head, scores, table, mask, softmax -->
    <text x="4" y="150" font-size="11" font-style="italic">Move head and output</text>
    <rect x="4" y="160" width="118" height="62" fill="none" stroke="#1a1a1a"/>
    <text x="63" y="176" text-anchor="middle" font-size="11" font-weight="bold">Move head</text>
    <text x="63" y="190" text-anchor="middle">conv 3×3, 64 → 64, ReLU</text>
    <text x="63" y="202" text-anchor="middle">conv 1×1, 64 → 64</text>
    <text x="63" y="216" text-anchor="middle" font-style="italic">41,088 parameters</text>
    <line x1="122" y1="191" x2="140" y2="191" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <rect x="142" y="160" width="118" height="62" fill="#e3e8ee" stroke="#1a1a1a"/>
    <text x="201" y="176" text-anchor="middle" font-size="11" font-weight="bold">Move-type scores</text>
    <text x="201" y="190" text-anchor="middle">64 types × 8 × 8</text>
    <text x="201" y="202" text-anchor="middle">= 4,096 numbers</text>
    <text x="201" y="216" text-anchor="middle" font-style="italic">(Figure 5a)</text>
    <line x1="260" y1="191" x2="278" y2="191" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <rect x="280" y="160" width="118" height="62" fill="none" stroke="#1a1a1a"/>
    <text x="339" y="176" text-anchor="middle" font-size="11" font-weight="bold">Fixed table</text>
    <text x="339" y="190" text-anchor="middle">1,792 on-board scores</text>
    <text x="339" y="202" text-anchor="middle">→ from–to slots</text>
    <text x="339" y="216" text-anchor="middle" font-style="italic">no parameters (Figure 5b)</text>
    <line x1="398" y1="191" x2="416" y2="191" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <rect x="418" y="160" width="118" height="62" fill="none" stroke="#1a1a1a"/>
    <text x="477" y="176" text-anchor="middle" font-size="11" font-weight="bold">Legal mask</text>
    <text x="477" y="190" text-anchor="middle">every slot that is not</text>
    <text x="477" y="202" text-anchor="middle">a legal move → −∞</text>
    <text x="477" y="216" text-anchor="middle" font-style="italic">(Figure 5c)</text>
    <line x1="536" y1="191" x2="554" y2="191" stroke="#1a1a1a" marker-end="url(#a9)"/>
    <rect x="556" y="160" width="120" height="62" fill="#e3e8ee" stroke="#b03a2e" stroke-width="1.3"/>
    <text x="616" y="176" text-anchor="middle" font-size="11" font-weight="bold">Softmax</text>
    <text x="616" y="190" text-anchor="middle">π(a | board) over</text>
    <text x="616" y="202" text-anchor="middle">the legal moves;</text>
    <text x="616" y="216" text-anchor="middle">play the most probable</text>
    <!-- residual block detail -->
    <text x="4" y="244" font-size="11" font-style="italic">One residual block (73,984 parameters)</text>
    <g stroke="#1a1a1a" fill="none">
      <rect x="66" y="252" width="80" height="22"/><rect x="164" y="252" width="62" height="22"/>
      <rect x="244" y="252" width="44" height="22"/><rect x="306" y="252" width="80" height="22"/>
      <rect x="404" y="252" width="62" height="22"/><rect x="514" y="252" width="44" height="22"/>
      <circle cx="490" cy="263" r="8"/>
    </g>
    <text x="30" y="267" text-anchor="middle">x</text>
    <text x="106" y="267" text-anchor="middle">conv 3×3</text>
    <text x="195" y="267" text-anchor="middle">BatchNorm</text>
    <text x="266" y="267" text-anchor="middle">ReLU</text>
    <text x="346" y="267" text-anchor="middle">conv 3×3</text>
    <text x="435" y="267" text-anchor="middle">BatchNorm</text>
    <text x="490" y="267" text-anchor="middle" font-size="11">+</text>
    <text x="536" y="267" text-anchor="middle">ReLU</text>
    <text x="600" y="267" text-anchor="middle">output</text>
    <g stroke="#1a1a1a">
      <line x1="38" y1="263" x2="64" y2="263" marker-end="url(#a9)"/>
      <line x1="146" y1="263" x2="162" y2="263" marker-end="url(#a9)"/>
      <line x1="226" y1="263" x2="242" y2="263" marker-end="url(#a9)"/>
      <line x1="288" y1="263" x2="304" y2="263" marker-end="url(#a9)"/>
      <line x1="386" y1="263" x2="402" y2="263" marker-end="url(#a9)"/>
      <line x1="466" y1="263" x2="480" y2="263" marker-end="url(#a9)"/>
      <line x1="498" y1="263" x2="512" y2="263" marker-end="url(#a9)"/>
      <line x1="558" y1="263" x2="580" y2="263" marker-end="url(#a9)"/>
    </g>
    <path d="M48,263 L48,282 L490,282 L490,273" fill="none" stroke="#1a1a1a" stroke-dasharray="3 2" marker-end="url(#a9)"/>
    <text x="270" y="294" text-anchor="middle" font-size="9" font-style="italic">skip connection: x is added back</text>
  </g>
</svg>
